# Render Blueprint — https://render.com/docs/blueprint-spec
# Step-by-step: docs/deploying-on-render.md

services:
  - type: web
    name: govuk-frontend-example-php
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DEMOS_ENABLED
        value: "true"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Must be a Laravel key from `php artisan key:generate --show`
      # (base64:…, 32 decoded bytes). Render generateValue is the wrong length.
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: file
